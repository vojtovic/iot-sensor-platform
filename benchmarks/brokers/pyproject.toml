[project]
name = "brokerbench"
version = "0.1.0"
description = "Rampový benchmark MQTT brokerů (propustnost, latence, zdroje)"
requires-python = ">=3.11"
dependencies = [
    "aiomqtt>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
viz = [
    "matplotlib>=3.8",
]
db = [
    "asyncpg>=0.29",          # pipeline benchmark: zápis do TimescaleDB
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["brokerbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
