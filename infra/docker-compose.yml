name: iot-sensor-platform

# Sdílená infrastruktura (Fáze 2 roadmapy).
#
# Spuštění:   docker compose up -d
# Zastavení:  docker compose down
# Reset dat:  docker compose down -v   (smaže pojmenované volumy emqx-data/emqx-log)
#
# Konfigurace přes infra/.env (zkopíruj infra/.env.example).
# Data brokeru jsou v pojmenovaných Docker volumech — nejsou v repu.

services:
  # ───────────────────────────────────────────────────────────────
  # MQTT broker
  # Dashboard:  http://localhost:18083  (admin / iot-dev — viz .env)
  # MQTT:       tcp://localhost:1883
  # WebSocket:  ws://localhost:8083/mqtt
  # ───────────────────────────────────────────────────────────────
  emqx:
    image: emqx/emqx:5.8
    container_name: iot-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    environment:
      # Konfigurace přes env vars (doporučený postup EMQX 5 v Dockeru) —
      # NEpřepisujeme emqx.conf, aby zůstaly výchozí listenery + dashboard.
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-iot-dev}
      # Anonymní připojení je ve výchozím stavu povoleno (žádné authn zdroje).
      # Per-device autentizace + ACL přijde ve Fázi 4 (viz ROADMAP §7).
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ───────────────────────────────────────────────────────────────
  # TimescaleDB  (telemetrie hypertable + relační metadata v jednom Postgresu)
  # Connection:  postgres://iot:iot-dev@localhost:5432/iot
  # ───────────────────────────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: iot-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot-dev}
      POSTGRES_DB: ${POSTGRES_DB:-iot}
    volumes:
      - ts-data:/var/lib/postgresql/data
      # Init skripty (schéma + seed) běží jen při PRVNÍM startu (prázdný volume).
      - ./timescale/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot} -d ${POSTGRES_DB:-iot}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ───────────────────────────────────────────────────────────────
  # Grafana  (vizualizace; datasource TimescaleDB je provisioned)
  # UI:  http://localhost:3000  (admin / iot-dev — viz .env)
  # Dashboardy samotné přijdou ve Fázi 5.
  # ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.0
    container_name: iot-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-iot-dev}
      # Předáno kvůli interpolaci v provisioning/datasources/timescale.yml.
      POSTGRES_USER: ${POSTGRES_USER:-iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot-dev}
      POSTGRES_DB: ${POSTGRES_DB:-iot}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  emqx-data:
  emqx-log:
  ts-data:
  grafana-data:
