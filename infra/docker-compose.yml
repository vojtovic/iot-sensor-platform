name: iot-sensor-platform

# Sdílená infrastruktura (Fáze 2) + sada MQTT brokerů k porovnání.
#
# PROFILY: každý broker je pod vlastním profilem (emqx, mosquitto, nanomq,
# hivemq, vernemq, rabbitmq, artemis). Vždy běží JEN JEDEN broker — všechny
# mapují host port 1883, takže simulátor pořád míří na localhost:1883.
# Platforma (DB + Grafana) je pod profilem 'platform'.
#
# Výchozí profily se berou z infra/.env (COMPOSE_PROFILES=platform,emqx).
#
# Spuštění (plný stack Fáze 2):   docker compose up -d
# Přepnutí brokeru:               ./broker.sh mosquitto    (down + up s profilem)
# Jen jeden broker (lean bench):  COMPOSE_PROFILES=mosquitto docker compose up -d
# Zastavení:                      docker compose --profile '*' down
#
# Konfigurace přes infra/.env (zkopíruj infra/.env.example).

services:
  # ═══════════════════════════════════════════════════════════════
  #  PLATFORMA  (profil: platform)
  # ═══════════════════════════════════════════════════════════════

  # TimescaleDB — telemetrie hypertable + relační metadata v jednom Postgresu.
  # Connection: postgres://iot:iot-dev@localhost:5432/iot
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: iot-timescaledb
    profiles: ["platform"]
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot-dev}
      POSTGRES_DB: ${POSTGRES_DB:-iot}
    volumes:
      - ts-data:/var/lib/postgresql/data
      - ./timescale/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot} -d ${POSTGRES_DB:-iot}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Grafana — vizualizace; datasource TimescaleDB je provisioned.
  # UI: http://localhost:3000  (admin / iot-dev)
  grafana:
    image: grafana/grafana:11.3.0
    container_name: iot-grafana
    profiles: ["platform"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-iot-dev}
      POSTGRES_USER: ${POSTGRES_USER:-iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot-dev}
      POSTGRES_DB: ${POSTGRES_DB:-iot}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ═══════════════════════════════════════════════════════════════
  #  MQTT BROKERY  (každý vlastní profil; vždy běží jen jeden na 1883)
  # ═══════════════════════════════════════════════════════════════

  # EMQX 5 — Erlang, feature-rich (dashboard, shared subs, MQTT 5).
  # MQTT 1883 · WS 8083 · dashboard http://localhost:18083 (admin/iot-dev)
  emqx:
    image: emqx/emqx:5.8
    container_name: iot-emqx
    profiles: ["emqx"]
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-iot-dev}
      # Anonymní připojení povoleno (per-device auth + ACL až Fáze 4).
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Eclipse Mosquitto — lehký broker v C, de-facto referenční MQTT.
  # MQTT 1883 · WS 9001
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-mosquitto
    profiles: ["mosquitto"]
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 mosquitto_sub -t '$$SYS/#' -C 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # NanoMQ — ultra-lehký broker pro edge/IoT (od EMQX, v C/NNG).
  # MQTT 1883 · HTTP API 8081
  nanomq:
    image: emqx/nanomq:0.22
    container_name: iot-nanomq
    profiles: ["nanomq"]
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8081:8081"
    # Bez healthchecku: image nemá vhodný neblokující probe (nanomq_cli pub/sub
    # drží spojení). Živost se ověřuje pub/sub testem (viz README).

  # HiveMQ Community Edition — Java, enterprise svět (CE = bez security ext,
  # anonymní povoleno). Pomalejší start (JVM). MQTT 1883.
  hivemq:
    image: hivemq/hivemq-ce:2024.3
    container_name: iot-hivemq
    profiles: ["hivemq"]
    restart: unless-stopped
    ports:
      - "1883:1883"
    # Bez healthchecku (image nemá nc/curl); živost přes pub/sub test.

  # VerneMQ — Erlang, distribuovaný broker. Vyžaduje souhlas s EULA.
  # MQTT 1883.
  vernemq:
    image: vernemq/vernemq:1.13.0
    container_name: iot-vernemq
    profiles: ["vernemq"]
    restart: unless-stopped
    ports:
      - "1883:1883"
    environment:
      DOCKER_VERNEMQ_ACCEPT_EULA: "yes"
      DOCKER_VERNEMQ_ALLOW_ANONYMOUS: "on"
    healthcheck:
      test: ["CMD-SHELL", "vmq-admin cluster show >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # RabbitMQ — primárně AMQP broker, MQTT přes plugin rabbitmq_mqtt.
  # MQTT 1883 · management UI http://localhost:15672 (guest/guest)
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: iot-rabbitmq
    profiles: ["rabbitmq"]
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "15672:15672"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

  # ActiveMQ Artemis — Java multi-protokol broker, MQTT acceptor na 1883.
  # MQTT 1883 · console http://localhost:8161 (artemis/artemis)
  artemis:
    image: apache/activemq-artemis:2.37.0
    container_name: iot-artemis
    profiles: ["artemis"]
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8161:8161"
    environment:
      ANONYMOUS_LOGIN: "true"
    # Bez healthchecku (image bez vhodného neblokujícího probe); pub/sub test.

volumes:
  emqx-data:
  emqx-log:
  ts-data:
  grafana-data:
