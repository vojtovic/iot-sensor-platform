# Eclipse Mosquitto — konfigurace pro lokální vývoj / broker benchmark.
# Mosquitto 2.x ve výchozím stavu poslouchá jen lokálně a zakazuje anonymní
# připojení — proto explicitní listener + allow_anonymous.

listener 1883
allow_anonymous true

# Volitelný WebSocket listener (paralela k EMQX 8083).
listener 9001
protocol websockets

# Méně ukecané logy.
log_dest stdout
