# RabbitMQ — MQTT přes plugin rabbitmq_mqtt (povolen v enabled_plugins).
# RabbitMQ je primárně AMQP broker; MQTT je tu jako alternativní protokol
# (srovnání architektur, bod 2 zadání).

# Povol uživatele 'guest' i ze sítě (default je guest jen z loopbacku).
loopback_users = none

# MQTT listener na standardním portu.
mqtt.listeners.tcp.default = 1883

# Anonymní MQTT připojení → mapuje se na guesta (lokální vývoj).
mqtt.allow_anonymous = true
mqtt.default_user = guest
mqtt.default_pass = guest
